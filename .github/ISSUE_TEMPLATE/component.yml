name: "🧩 Add Component"
description: "Propose a completely new kind of README element (e.g. GitHub Star Badge, Visitor Counter, Typing Animation)"
title: "[Component] "
labels: ["component", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Propose a new **Component** (a kind of feature/element usable in a README).

        > If it's just a data/color/text variant of an existing Component (e.g. "C++" is a variant of "Language Badge"), this isn't a Component — it's a **Preset**.
        > In that case, please use the [🎨 Add Preset](../../issues/new?template=preset.yml) template instead.

        This should be a new Component if any of these apply:
        - Its Settings structure is fundamentally different from existing ones
        - Its Preview rendering works differently
        - Its Markdown generation works differently
        - The purpose/concept of using it is different
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: "e.g. GitHub Star Badge"
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: Description
      placeholder: "e.g. A badge showing a repository's live star count"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: "If you need a new category, pick 'Other' and write the name you want below. (Category is data-driven, so a new value works right away.)"
      options:
        - Languages
        - Frameworks
        - Databases
        - Tools
        - Stats
        - Social
        - Decorations
        - Other (write below)
    validations:
      required: true
  - type: input
    id: categoryOther
    attributes:
      label: "If you picked 'Other' above, write the category name here"
      placeholder: "e.g. Widgets"
  - type: input
    id: tags
    attributes:
      label: Tags (comma-separated)
      placeholder: "Stats, Badge, GitHub Only"
  - type: textarea
    id: exampleUrl
    attributes:
      label: Example URL (a real, working URL that renders an image)
      description: |
        Paste a URL that actually works as-is. Values after the question mark (`?key=value`) automatically become input fields.
        If a value in the middle of the path (e.g. a repo name) needs to change, wrap just that part in `{fieldName}`.
      placeholder: "https://img.shields.io/github/stars/{owner}/{repo}?style=social"
      render: text
    validations:
      required: true
  - type: dropdown
    id: linkable
    attributes:
      label: Does it need a link to navigate to on click?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this needed? (optional)
      placeholder: "I'd like to use this in my README, but it's not in the library yet..."
  - type: checkboxes
    id: checks
    attributes:
      label: Please confirm
      options:
        - label: I checked the library doesn't already have something similar
          required: true
        - label: I checked the Component vs Preset criteria above, and this should be a new Component, not a Preset
          required: true
