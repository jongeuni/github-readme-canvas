name: "🎨 Add Preset"
description: "Add a new value variant (language, icon, etc.) to an existing Component (e.g. add Kotlin to Language Badge)"
title: "[Preset] "
labels: ["preset", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Add a new **Preset** (a variant differing only in data/default values) to an existing **Component**.

        > If the rendering or Settings structure itself is different, this isn't a Preset — it's a new **Component**.
        > In that case, please use the [🧩 Add Component](../../issues/new?template=component.yml) template instead.
  - type: dropdown
    id: targetComponent
    attributes:
      label: Which Component do you want to add this to?
      options:
        - Language Badge
        - Tech Icon
        - Other (write below)
    validations:
      required: true
  - type: input
    id: targetComponentOther
    attributes:
      label: "If you picked 'Other', write the Component name here"
      placeholder: "e.g. Social Link"
  - type: input
    id: presetName
    attributes:
      label: Preset name
      placeholder: "e.g. Kotlin"
    validations:
      required: true
  - type: textarea
    id: presetValues
    attributes:
      label: Values this Preset changes
      description: "Fill in the settings this Component uses. If you're not sure, it's fine to leave this blank — we'll fill it in during review."
      placeholder: |
        label: Kotlin
        color: purple
        link: https://kotlinlang.org
      render: yaml
  - type: checkboxes
    id: checks
    attributes:
      label: Please confirm
      options:
        - label: I checked there isn't already a Preset with the same name
          required: true
